

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: greenyellow;
    }
</style>

<body>
    <!-- Create a hacking simulator which has green background and it shows these messages with random delay of 1 to 7 seconds 
    
    Initializing Hacking...
    Reading your Files...
    Password files Detected...
    Sending all passwords and personal files to server...
    Cleaning up...

    The three dots must blink so that it looks like a real terminal
    -->

    <script>
        async function getData() {                   // This function simulates an asynchronous operation 
            // Simulate getting data from a server                //bacground mem chlne do
           
            let random = Math.random()*(7000)+1000; // Random delay between 1 to 7 seconds
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve('...')
                },random ); // Convert seconds to milliseconds
            })
        }

        async function main() {                    // as await is used, this function must be declared as async
            console.log("Initializing Hacking...")

              let data1 = await getData() 
            console.log(data1)

            console.log("Reading your Files...")

              let data2 = await getData() 
              console.log(data2)

            console.log("Password files Detected...")

            let data3 = await getData()         
            console.log(data3) 

            console.log("Sending all passwords and personal files to server...")

              let data4 = await getData() 
            console.log(data4)

            console.log("Cleaning up...")

        }

        main()

    </script>

</body>

</html>
